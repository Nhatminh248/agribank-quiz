<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fef7ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tra cứu Câu hỏi Agribank</title>
    <!-- Google Fonts: Roboto & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Google App Bar -->
    <header class="google-app-bar">
        <div class="app-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M12 2L2 7v2h20V7L12 2zm8 9h-3v7h3v-7zm-5 0h-2v7h2v-7zm-4 0H9v7h2v-7zm-4 0H4v7h3v-7zM2 20v2h20v-2H2z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1 class="app-title">Agribank Quiz</h1>
                <span class="app-tag">Ngân hàng đề 2026</span>
            </div>
        </div>
    </header>

    <!-- Google Sticky Search & Filter Header -->
    <div class="search-sticky-container">
        <!-- Google M3 Search Bar -->
        <div class="m3-search-bar">
            <div class="search-leading-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Tìm kiếm trong câu hỏi..." 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"
                autofocus
            >
            <button type="button" id="clearBtn" class="m3-icon-button clear-btn" aria-label="Xoá tìm kiếm">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                </svg>
            </button>
        </div>

        <!-- Material 3 Filter Controls -->
        <div class="m3-filter-strip">
            <div class="m3-select-wrapper">
                <div class="select-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                    </svg>
                </div>
                <select id="categorySelect" aria-label="Chọn chuyên đề hoặc đợt thi">
                    <option value="">Đang nạp ngân hàng đề...</option>
                </select>
            </div>
            <span id="statsBadge" class="m3-badge">0 câu</span>
        </div>
    </div>

    <!-- Danh sách câu hỏi dạng thẻ M3 -->
    <main id="results" class="cards-container">
        <div class="empty-state">
            <div class="m3-spinner"></div>
            <p>Đang tải danh sách câu hỏi...</p>
        </div>
    </main>

    <!-- Google Material 3 Floating Action Button (FAB) -->
    <button id="backToTop" class="m3-fab" title="Lên đầu trang" aria-label="Cuộn lên đầu trang">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
    </button>

    <!-- Dữ liệu và Scripts -->
    <script src="data/questions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#fff8f6" id="themeMetaColor">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Tra cứu Câu hỏi Agribank - Material 3</title>
    <!-- Google Fonts: Google Sans & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Google Material 3 App Bar -->
    <header class="google-app-bar">
        <div class="app-brand">
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M12 2L2 7v2h20V7L12 2zm8 9h-3v7h3v-7zm-5 0h-2v7h2v-7zm-4 0H9v7h2v-7zm-4 0H4v7h3v-7zM2 20v2h20v-2H2z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1 class="app-title">Agribank Quiz</h1>
                <span class="app-tag">Ngân hàng đề trắc nghiệm 2026</span>
            </div>
        </div>

        <div class="app-actions">
            <!-- Theme Mode Toggle Button -->
            <button id="themeToggleBtn" class="m3-icon-button-tonal" title="Chuyển chế độ sáng/tối" aria-label="Đổi giao diện sáng tối">
                <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Google Sticky Search & Filter Header -->
    <div class="search-sticky-container">
        <!-- Google M3 Search Bar -->
        <div class="m3-search-bar" id="m3SearchBar">
            <div class="search-leading-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Tìm kiếm trong nội dung câu hỏi..." 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false"
                aria-label="Tìm kiếm câu hỏi"
            >
            <div class="search-trailing">
                <span class="search-shortcut-badge" title="Phím tắt: gõ / để tìm nhanh">/</span>
                <button type="button" id="clearBtn" class="m3-icon-button clear-btn" aria-label="Xoá nội dung tìm kiếm" title="Xoá tìm kiếm">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Material 3 Quick Filter Chips Carousel -->
        <div class="m3-chips-scroll" id="chipsScroll" role="tablist" aria-label="Bộ lọc nhanh theo danh mục">
            <!-- Dynamically populated chips -->
        </div>

        <!-- Material 3 Filter Controls (Dropdown & Stats Badge) -->
        <div class="m3-filter-strip">
            <div class="m3-select-wrapper">
                <div class="select-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                    </svg>
                </div>
                <select id="categorySelect" aria-label="Chọn chuyên đề hoặc đợt thi">
                    <option value="">Đang nạp ngân hàng đề...</option>
                </select>
            </div>
            <span id="statsBadge" class="m3-badge">0 câu</span>
        </div>
    </div>

    <!-- Danh sách câu hỏi dạng thẻ M3 -->
    <main id="results" class="cards-container" aria-live="polite">
        <div class="empty-state">
            <div class="m3-spinner"></div>
            <p>Đang tải danh sách câu hỏi...</p>
        </div>
    </main>

    <!-- Google Material 3 Floating Action Button (FAB) -->
    <button id="backToTop" class="m3-fab" title="Cuộn lên đầu trang" aria-label="Cuộn lên đầu trang">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
        </svg>
    </button>

    <!-- Dữ liệu và Scripts -->
    <script src="data/questions.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

0e0 3", "correct": "4", "source": "\u0110i\u1ec1u 13 Quy \u0111\u1ecbnh s\u1ed1 3559/Qy\u0110-NHNo-TD ng\u00e0y 18/10/2024"}, {"category": "4 - 240 c\u00e2u", "question": "C\u0103n c\u1ee9 Quy \u0111\u1ecbnh s\u1ed1 2268/Qy\u0110- NHNo-TD ng\u00e0y 19/9/2023, Th\u1ee9 t\u1ef1 thu n\u1ee3 \u0111\u1ed1i v\u1edbi kh\u00e1ch h\u00e0ng c\u00f3 c\u1ea3 d\u01b0 n\u1ee3 n\u1ed9i b\u1ea3ng, ngo\u1ea1i b\u1ea3ng nh\u01b0 th\u1ebf n\u00e0o l\u00e0 \u0111\u00fang?", "a1": "Thu n\u1ee3 ngo\u1ea1i b\u1ea3ng tr\u01b0\u1edbc, thu n\u1ee3 n\u1ed9i b\u1ea3ng sau", "a2": "Thu n\u1ee3 n\u1ed9i b\u1ea3ng tr\u01b0\u1edbc, thu n\u1ee3 ngo\u1ea1i b\u1ea3ng sau; Kho\u1ea3n n\u1ee3 \u0111\u1ebfn h\u1ea1n tr\u01b0\u1edbc thu tr\u01b0\u1edbc, kho\u1ea3n n\u1ee3 \u0111\u1ebfn h\u1ea1n sau thu sau.", "a3": "Thu n\u1ee3 theo \u0111\u1ec1 xu\u1ea5t c\u1ee7a kh\u00e1ch h\u00e0ng; Kho\u1ea3n n\u1ee3 \u0111\u1ebfn h\u1ea1n tr\u01b0\u1edbc thu tr\u01b0\u1edbc, kho\u1ea3n n\u1ee3 \u0111\u1ebfn h\u1ea1n sau thu sau", "a4": "Th\u1ee9 t\u1ef1 thu n\u1ee3 \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n  theo ch\u1ec9 \u0111\u1ea1o c\u1ee7a Gi\u00e1m \u0111\u1ed1c Agribank n\u01a1i cho vay", "correct": "2", "source": "\u0110i\u1ec3m a, Kho\u1ea3n 2 \u0110i\u1ec1u 60 Quy \u0110\u1ecbnh s\u1ed1 2268/Qy\u0110- NHNo-TD ng\u00e0y 19/9/2023"}];
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const statsDisplay = document.getElementById('stats');

        function highlight(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        function render(filter = '') {
            const query = filter.trim().toLowerCase();
            const filtered = questions.filter(q => 
                q.question.toLowerCase().includes(query) || 
                q.a1.toLowerCase().includes(query) || 
                q.a2.toLowerCase().includes(query) || 
                q.a3.toLowerCase().includes(query) || 
                q.a4.toLowerCase().includes(query)
            );

            statsDisplay.innerText = `Tìm thấy ${filtered.length} câu hỏi`;
            resultsContainer.innerHTML = filtered.slice(0, 150).map(q => {
                const correctIdx = q.correct;
                return `
                    <div class="question-card">
                        <div class="category">${q.category}</div>
                        <div class="question-text">${highlight(q.question, query)}</div>
                        <div class="answer ${correctIdx == '1' ? 'correct' : ''}">1. ${highlight(q.a1, query)}</div>
                        <div class="answer ${correctIdx == '2' ? 'correct' : ''}">2. ${highlight(q.a2, query)}</div>
                        <div class="answer ${correctIdx == '3' ? 'correct' : ''}">3. ${highlight(q.a3, query)}</div>
                        ${q.a4 ? `<div class="answer ${correctIdx == '4' ? 'correct' : ''}">4. ${highlight(q.a4, query)}</div>` : ''}
                        ${q.source ? `<div class="source">Nguồn: ${q.source}</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        searchInput.addEventListener('input', (e) => render(e.target.value));
        render();
    </script>
